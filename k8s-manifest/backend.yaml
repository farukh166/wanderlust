apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: wanderlust
  labels:
    app: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend
      labels:
        app: backend
    spec:
      containers:
        - name: wanderlust-backend
          image: farukh166/wanderlust-backend:v5
          ports:
            - containerPort: 3010

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: wanderlust

spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 3010
      targetPort: 3010
      nodePort: 31100
