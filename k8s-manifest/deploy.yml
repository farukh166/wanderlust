apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  labels:
    app: backend

spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend-app
          image: farukh166/wanderlust-backend:v2
          ports:
            - containerPort: 3010
